name: Build Smart Dialer Pro APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses & install API 36.1 platform
        run: |
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "Using ANDROID_SDK=$ANDROID_SDK"
          if [ -x "$SDKMANAGER" ]; then
            { yes || true; } | "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --licenses >/dev/null
            "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --install \
              "platform-tools" \
              "platforms;android-36.1" \
              "build-tools;36.0.0" || \
            "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --install \
              "platform-tools" \
              "platforms;android-36" \
              "build-tools;36.0.0"
          else
            echo "sdkmanager not found at $SDKMANAGER; relying on preinstalled SDK."
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug signing keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Rename Debug APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Smart Dialer Pro-debug.apk"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Smart-Dialer-Pro-Debug-APK
          path: dist/Smart Dialer Pro-debug.apk
          retention-days: 30

  build-release-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check if release keystore secret is configured
        id: check_secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_PASS" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "Skipping signed release APK: configure RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD repository secrets."
          fi

      - name: Set up JDK 21
        if: steps.check_secrets.outputs.has_signing == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses & install API 36.1 platform
        if: steps.check_secrets.outputs.has_signing == 'true'
        run: |
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            { yes || true; } | "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --licenses >/dev/null
            "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --install \
              "platform-tools" \
              "platforms;android-36.1" \
              "build-tools;36.0.0" || \
            "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --install \
              "platform-tools" \
              "platforms;android-36" \
              "build-tools;36.0.0"
          fi

      - name: Set up Gradle 9.3.1
        if: steps.check_secrets.outputs.has_signing == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Decode release keystore
        if: steps.check_secrets.outputs.has_signing == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "${{ github.workspace }}/my-upload-key.jks"

      - name: Build Release APK
        if: steps.check_secrets.outputs.has_signing == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Rename Release APK
        if: steps.check_secrets.outputs.has_signing == 'true'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Smart Dialer Pro-release.apk"

      - name: Upload Release APK Artifact
        if: steps.check_secrets.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: Smart-Dialer-Pro-Release-APK
          path: dist/Smart Dialer Pro-release.apk
          retention-days: 30

      - name: Clean up release keystore
        if: always() && steps.check_secrets.outputs.has_signing == 'true'
        run: rm -f "${{ github.workspace }}/my-upload-key.jks"

      - name: Publish Release APK to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v') && steps.check_secrets.outputs.has_signing == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Smart Dialer Pro-release.apk
