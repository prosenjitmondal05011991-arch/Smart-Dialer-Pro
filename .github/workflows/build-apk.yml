name: Build Smart Dialer Pro APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses & install API 36.1 platform
        run: |
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$ANDROID_SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          echo "Using ANDROID_SDK=$ANDROID_SDK"
          echo "Using SDKMANAGER=$SDKMANAGER"

          mkdir -p "$ANDROID_SDK/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_SDK/licenses/android-sdk-license"

          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            { yes || true; } | "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --licenses >/dev/null
            "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --install \
              "platform-tools" \
              "platforms;android-36.1" \
              "build-tools;36.0.0" || \
            "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --install \
              "platform-tools" \
              "platforms;android-36" \
              "build-tools;36.0.0"
          else
            echo "Warning: sdkmanager not found under $ANDROID_SDK"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug signing keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f app/google-services.json ]; then
            echo "Found app/google-services.json in repository."
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            TRIMMED="$(printf '%s' "$GOOGLE_SERVICES_JSON" | sed 's/^[[:space:]]*//')"
            if [[ "$TRIMMED" == \{* ]]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '\n\r ' | base64 -d > app/google-services.json
            fi
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
          else
            {
              echo "### Missing app/google-services.json"
              echo "Add a GitHub Actions repository secret named \`GOOGLE_SERVICES_JSON\` containing the contents of \`app/google-services.json\` from AI Studio, then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::app/google-services.json is missing. Add the GOOGLE_SERVICES_JSON repository secret in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Build Debug APK
        run: |
          set -o pipefail
          if ! gradle :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee gradle-debug-build.log; then
            {
              echo "### Debug APK Build Error Details"
              echo '```text'
              tail -n 100 gradle-debug-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Rename Debug APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Smart Dialer Pro-debug.apk"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Smart-Dialer-Pro-Debug-APK
          path: dist/Smart Dialer Pro-debug.apk
          retention-days: 30

  build-release-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check if release keystore secret is configured
        id: check_secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_PASS" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "Skipping signed release APK: configure RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD repository secrets."
          fi

      - name: Set up JDK 21
        if: steps.check_secrets.outputs.has_signing == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses & install API 36.1 platform
        if: steps.check_secrets.outputs.has_signing == 'true'
        run: |
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$ANDROID_SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          mkdir -p "$ANDROID_SDK/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_SDK/licenses/android-sdk-license"

          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            { yes || true; } | "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --licenses >/dev/null
            "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --install \
              "platform-tools" \
              "platforms;android-36.1" \
              "build-tools;36.0.0" || \
            "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --install \
              "platform-tools" \
              "platforms;android-36" \
              "build-tools;36.0.0"
          fi

      - name: Set up Gradle 9.3.1
        if: steps.check_secrets.outputs.has_signing == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Prepare google-services.json
        if: steps.check_secrets.outputs.has_signing == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f app/google-services.json ]; then
            echo "Found app/google-services.json in repository."
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            TRIMMED="$(printf '%s' "$GOOGLE_SERVICES_JSON" | sed 's/^[[:space:]]*//')"
            if [[ "$TRIMMED" == \{* ]]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '\n\r ' | base64 -d > app/google-services.json
            fi
          else
            echo "::error::app/google-services.json is missing. Add the GOOGLE_SERVICES_JSON repository secret."
            exit 1
          fi

      - name: Decode release keystore
        if: steps.check_secrets.outputs.has_signing == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "${{ github.workspace }}/my-upload-key.jks"

      - name: Build Release APK
        if: steps.check_secrets.outputs.has_signing == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! gradle :app:assembleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee gradle-release-build.log; then
            {
              echo "### Release APK Build Error Details"
              echo '```text'
              tail -n 100 gradle-release-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Rename Release APK
        if: steps.check_secrets.outputs.has_signing == 'true'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Smart Dialer Pro-release.apk"

      - name: Upload Release APK Artifact
        if: steps.check_secrets.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: Smart-Dialer-Pro-Release-APK
          path: dist/Smart Dialer Pro-release.apk
          retention-days: 30

      - name: Clean up release keystore
        if: always() && steps.check_secrets.outputs.has_signing == 'true'
        run: rm -f "${{ github.workspace }}/my-upload-key.jks"

      - name: Publish Release APK to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v') && steps.check_secrets.outputs.has_signing == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Smart Dialer Pro-release.apk
